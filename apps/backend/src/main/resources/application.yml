spring:
  application:
    name: ziboto-backend
  
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/ziboto}
    username: ${DATABASE_USERNAME:ziboto}
    password: ${DATABASE_PASSWORD:ziboto123}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:10}
      minimum-idle: 5
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000
      data-source-properties:
        serverTimezone: UTC
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        use_sql_comments: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
    open-in-view: false
  
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: true
  
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 60000
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2
          max-wait: -1ms
  
  # Spring Session Redis — shared session store for OAuth2 state across ASG instances.
  # Spring Security's HttpSessionOAuth2AuthorizationRequestRepository stores the OAuth
  # authorization request in the HTTP session. Without shared session storage, instance A
  # may create the OAuth session during /oauth2/authorization/google, but if the ALB
  # routes the Google callback to instance B, it finds no saved state and redirects to
  # /login?error. Redis is already in the infrastructure — this simply routes HttpSession
  # through it so any instance can recover the OAuth authorization request.
  session:
    store-type: redis
    redis:
      namespace: ziboto:session
      flush-mode: on-save
  
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:ziboto}
    password: ${RABBITMQ_PASSWORD:ziboto123}
    virtual-host: ${RABBITMQ_VHOST:/}
    listener:
      simple:
        acknowledge-mode: auto
        concurrency: 3
        max-concurrency: 10
        prefetch: 10
        retry:
          enabled: true
          initial-interval: 1000
          max-attempts: 3
          max-interval: 10000
          multiplier: 2.0
    template:
      retry:
        enabled: true
        initial-interval: 1000
        max-attempts: 3
        max-interval: 10000
        multiplier: 2.0
  
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            scope:
              - email
              - profile
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            user-name-attribute: sub
  
  servlet:
    multipart:
      enabled: true
      max-file-size: ${MAX_FILE_SIZE:100MB}
      max-request-size: ${MAX_REQUEST_SIZE:100MB}

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: on_param
    include-exception: false
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
    min-response-size: 1024
  # Security headers configuration
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        secure: true
        same-site: lax

# Application Configuration
app:
  security:
    jwt:
      secret: ${JWT_SECRET:}
      expiration: ${JWT_EXPIRATION:900000} # 15 minutes in milliseconds (900000ms = 15min)
      refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000} # 7 days in milliseconds (604800000ms = 7d)
    cors:
      # Credentials are enabled, so this is an explicit allow-list rather than a wildcard.
      # Deployments may add origins through CORS_ALLOWED_ORIGINS, but must retain the
      # production frontend when browser access is required.
      allowed-origins: ${CORS_ALLOWED_ORIGINS:https://ziboto.alliededge.app,http://localhost:5173}
      allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
      allowed-headers: Content-Type,Authorization,X-Requested-With
      allow-credentials: true
      max-age: 3600
  
  oauth:
    redirect-url: ${OAUTH_REDIRECT_URL:http://localhost:5173/oauth/callback}
  
  storage:
    type: ${STORAGE_TYPE:s3} # Production uses S3 only
    s3:
      bucket-name: ${AWS_S3_BUCKET:ziboto-files-277522752099-eu-north-1-an}
      region: ${AWS_REGION:eu-north-1}
      multipart-threshold-size: ${S3_MULTIPART_THRESHOLD:104857600} # 100MB
      part-size: ${AWS_S3_PART_SIZE:10485760} # 10MB
      max-concurrency: ${AWS_S3_MAX_CONCURRENCY:10}
      presigned-url-expiration-minutes: ${AWS_S3_PRESIGNED_URL_EXPIRATION:15}
      enable-encryption: ${AWS_S3_ENABLE_ENCRYPTION:true}
      storage-class: ${AWS_S3_STORAGE_CLASS:STANDARD}
      enable-versioning: ${AWS_S3_ENABLE_VERSIONING:false}
      key-prefix: ${AWS_S3_KEY_PREFIX:files/}
      connection-timeout: ${AWS_S3_CONNECTION_TIMEOUT:10000}
      read-timeout: ${AWS_S3_READ_TIMEOUT:60000}
  
  file:
    max-size: ${MAX_FILE_SIZE:524288000} # 500MB in bytes
    allowed-types: ${ALLOWED_MIME_TYPES:} # Comma-separated list, empty = all allowed
  
  cache:
    ttl: ${CACHE_TTL:3600}
    prefix: "ziboto"
  
  # Email / Resend Configuration
  email:
    api-key: ${RESEND_API_KEY:}
    from-email: ${RESEND_FROM_EMAIL:noreply@ziboto.com}
    from-name: ${RESEND_FROM_NAME:Ziboto}
    verification-url: ${RESEND_VERIFICATION_URL:http://localhost:5173/verify-email}
    reset-password-url: ${RESEND_RESET_URL:http://localhost:5173/reset-password}
    support-email: ${RESEND_SUPPORT_EMAIL:support@ziboto.com}
  
  # Redis Configuration
  redis:
    # Rate Limiting Configuration
    rate-limit:
      login:
        max-attempts: ${REDIS_RATE_LIMIT_LOGIN_MAX:5}
        window-minutes: ${REDIS_RATE_LIMIT_LOGIN_WINDOW:15}
      signup:
        max-attempts: ${REDIS_RATE_LIMIT_SIGNUP_MAX:3}
        window-minutes: ${REDIS_RATE_LIMIT_SIGNUP_WINDOW:60}
      api:
        max-requests: ${REDIS_RATE_LIMIT_API_MAX:100}
        window-minutes: ${REDIS_RATE_LIMIT_API_WINDOW:1}
      refresh:
        max-attempts: ${REDIS_RATE_LIMIT_REFRESH_MAX:1000}
        window-hours: ${REDIS_RATE_LIMIT_REFRESH_WINDOW:1}
    
    # Failed Login Tracking Configuration
    failed-login:
      max-attempts: ${REDIS_FAILED_LOGIN_MAX:5}
      lockout-minutes: ${REDIS_FAILED_LOGIN_LOCKOUT:30}
      tracking-hours: ${REDIS_FAILED_LOGIN_TRACKING:1}
    
    # Session Cache Configuration
    session:
      ttl-hours: ${REDIS_SESSION_TTL:1}
      extended-ttl-hours: ${REDIS_SESSION_EXTENDED_TTL:24}
      sliding-window: ${REDIS_SESSION_SLIDING_WINDOW:true}
      max-concurrent-sessions: ${REDIS_SESSION_MAX_CONCURRENT:0} # 0 = unlimited
    
    # Token Blacklist Configuration
    token-blacklist:
      enabled: ${REDIS_TOKEN_BLACKLIST_ENABLED:true}
      max-ttl-days: ${REDIS_TOKEN_BLACKLIST_MAX_TTL:7}
    
    # OTP Configuration
    otp:
      ttl-minutes: ${REDIS_OTP_TTL:5}
      max-attempts: ${REDIS_OTP_MAX_ATTEMPTS:3}
      rate-limit-minutes: ${REDIS_OTP_RATE_LIMIT:15}
      max-verification-attempts: ${REDIS_OTP_MAX_VERIFY:3}
    
    # Key Prefixes for namespace isolation
    key-prefix:
      rate-limit: "rate_limit"
      failed-login: "failed_login"
      session: "session"
      token-blacklist: "token:blacklist"
      otp: "otp"

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    export:
      prometheus:
        enabled: true

# Logging Configuration
logging:
  level:
    root: INFO
    com.ziboto: ${LOG_LEVEL:DEBUG}
    com.ziboto.backend.security: INFO
    com.ziboto.backend.audit: INFO
    com.ziboto.backend.auth: DEBUG
    org.springframework.web: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(${LOG_LEVEL_PATTERN:-%5p}) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n${LOG_EXCEPTION_CONVERSION_WORD:-%wEx}"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: ${LOG_FILE:logs/ziboto.log}
    max-size: ${LOG_FILE_MAX_SIZE:10MB}
    max-history: ${LOG_FILE_MAX_HISTORY:30}
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30
      total-size-cap: 1GB

# OpenAPI Configuration
springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
  show-actuator: false
