spring:
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false

  rabbitmq:
    ssl:
      enabled: true

server:
  error:
    include-stacktrace: never
    include-exception: false
  # Trust X-Forwarded-* headers from the AWS ALB.
  # The ALB terminates HTTPS and forwards plain HTTP to the backend on port 8080.
  # Without this, Spring Boot generates http:// OAuth redirect URIs instead of https://,
  # causing Google's redirect_uri_mismatch error.
  forward-headers-strategy: framework

logging:
  level:
    root: WARN
    com.ziboto: INFO
    org.springframework.web: WARN
    org.springframework.security: WARN
    org.hibernate.SQL: WARN

springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false